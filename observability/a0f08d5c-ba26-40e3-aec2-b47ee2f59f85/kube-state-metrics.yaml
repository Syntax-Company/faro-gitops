# Generado por faro-observability para el cluster a0f08d5c-ba26-40e3-aec2-b47ee2f59f85 y commiteado por el core (etapa 1.3).
# kube-state-metrics recortado a lo que usa el addon: reinicios de los contenedores y el motivo de su
# última terminación (OOMKilled, Error…). cAdvisor no los reporta.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: faro-observability
  labels:
    app.kubernetes.io/part-of: faro-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: faro-observability-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: faro-observability
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: faro-observability-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: faro-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: faro-observability-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: faro-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: faro-observability
  labels:
    app.kubernetes.io/part-of: faro-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          args:
            # Solo pods, y de sus métricas solo estas dos: por defecto expone cientos.
            - --resources=pods
            - --metric-allowlist=kube_pod_container_status_restarts_total,kube_pod_container_status_last_terminated_reason
          ports:
            - name: http-metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
